<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer Performance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Dark Theme Overrides for Dashboard */
    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--text-main); 
    }
    
    .dashboard-container { max-width: 1000px; margin: 0 auto; padding: 20px; margin-top: 100px; }
    
    /* Top Metric Cards (Glassmorphism) */
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .metric-card { 
      background: var(--surface); 
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px; border-radius: 16px; 
      box-shadow: var(--shadow-md); text-align: center; 
    }
    .metric-card h3 { margin: 0; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .metric-card .value { font-size: 2rem; font-weight: bold; color: var(--green-primary); margin-top: 10px; text-shadow: 0 0 10px var(--green-glow); }

    /* Leaderboard Cards */
    .leaderboard { display: flex; flex-direction: column; gap: 20px; }
    .trainer-card { 
      background: var(--surface); 
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px; padding: 24px; 
      box-shadow: var(--shadow-md); 
      transition: transform 0.3s ease;
    }
    .trainer-card:hover { transform: translateY(-3px); }
    
    /* Top row of the card */
    .card-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
    .trainer-info { display: flex; align-items: center; gap: 15px; }
    
    .rank-circle { 
      width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); 
      display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff;
    }
    .rank-1 { background: #ffd700; color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
    .rank-2 { background: #c0c0c0; color: #000; }
    .rank-3 { background: #cd7f32; color: #fff; }
    
    .trainer-info img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid var(--green-primary); box-shadow: 0 0 10px var(--green-glow); }
    .trainer-info h4 { margin: 0; font-size: 1.3rem; color: #fff; }
    
    .total-score { text-align: right; display: flex; align-items: center; gap: 30px; }
    .total-score .clients-count { font-size: 0.9rem; color: var(--text-muted); }
    .total-score .score-box { text-align: center; }
    .total-score .score { font-size: 2.2rem; font-weight: bold; color: #fff; line-height: 1; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .total-score .label { font-size: 0.8rem; color: var(--green-primary); text-transform: uppercase; font-weight: bold; }

    /* Detailed Breakdown */
    .breakdown-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; text-align: center; }
    .stat-box { padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.03); }
    .stat-box h5 { margin: 0 0 8px 0; font-size: 0.8rem; color: var(--text-muted); }
    .stat-box .count { font-size: 1.5rem; font-weight: bold; }
    
    /* Colors for specific stats */
    .stat-excellent .count { color: #4caf50; }
    .stat-good .count { color: #2196f3; }
    .stat-average .count { color: #ffc107; }
    .stat-needs .count { color: #e91e63; }
    .stat-poor .count { color: #9e9e9e; }

    @media (max-width: 768px) {
      .dashboard-container { margin-top: 90px; padding: 15px; }
      .card-header { flex-direction: column; align-items: flex-start; gap: 15px; }
      .total-score { text-align: left; width: 100%; justify-content: space-between; }
      .breakdown-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="app-header" id="main-header">
    <div class="header-text">
      <h1>Instructor Performance</h1>
      <p><strong>Marking Criteria:</strong> Excellent = 3 | Good = 2 | Average = 1 | Needs Improvement = 0 | Poor = -1</p>
    </div>
    <img src="logo.png" alt="High Impact Gym" class="header-logo">
  </header>

  <main class="dashboard-container">
    
    <!-- Top Metrics -->
    <div class="metrics-grid" id="top-metrics">
      <div class="metric-card">
        <h3>Top Performer</h3>
        <div class="value" id="top-trainer">Loading...</div>
      </div>
      <div class="metric-card">
        <h3>Total Evaluations</h3>
        <div class="value" id="total-evals">0</div>
      </div>
      <div class="metric-card">
        <h3>Highest Score</h3>
        <div class="value" id="highest-score">0</div>
      </div>
    </div>

    <!-- Leaderboard List -->
    <div class="leaderboard" id="leaderboard">
      <p style="text-align:center;">Loading data...</p>
    </div>

  </main>

  <script>
    // 1. HIDE/SHOW HEADER ON SCROLL
    let lastScrollTop = 0;
    const header = document.getElementById('main-header');
    window.addEventListener('scroll', function() {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollTop > lastScrollTop && scrollTop > 100) {
        header.classList.add('header-hidden');
      } else {
        header.classList.remove('header-hidden');
      }
      lastScrollTop = scrollTop;
    });

    // 2. FETCH AND DISPLAY DATA
    // 🚨 PASTE YOUR GOOGLE APPS SCRIPT URL HERE 🚨
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwbKqZy4tFHBlVZpSUHDtsejeTTPPLGgrzsuuNL5cbNKB3xBxHK9BM5MHfzMYcaloM/exec';

    const trainerImages = {
      "Sameera": "assets/trainers/Sameera.png",
      "Chamindu": "assets/trainers/Chamindu.png",
      "Kavindu": "assets/trainers/Kavindu.png",
      "Ravija": "assets/trainers/Navija.png",
      "Bhagya": "assets/trainers/bhagya.png",
      "Dilshan": "assets/trainers/Dilshan.png",
      "Pavani": "assets/trainers/pavani.png",
      "Thilini": "assets/trainers/Thilini.png",
      "Hiruka": "assets/trainers/Hiruka.png",
      "Shalani": "assets/trainers/Shalani.png"
    };

    fetch(ENDPOINT)
      .then(res => res.json())
      .then(response => {
        if (!response.ok || response.data.length === 0) {
          document.getElementById('leaderboard').innerHTML = '<p style="text-align:center;">No evaluations submitted yet.</p>';
          return;
        }

        const data = response.data;
        const leaderboardDiv = document.getElementById('leaderboard');
        leaderboardDiv.innerHTML = ''; 

        // Update Top Metrics
        const topTrainer = data[0]; 
        document.getElementById('top-trainer').textContent = topTrainer.name;
        document.getElementById('highest-score').textContent = topTrainer.marks;
        
        let totalEvals = 0;
        data.forEach(t => totalEvals += t.clients);
        document.getElementById('total-evals').textContent = totalEvals;

        // Build the Leaderboard Cards
        data.forEach(t => {
          let rankClass = "";
          if (t.rank === 1) rankClass = "rank-1";
          else if (t.rank === 2) rankClass = "rank-2";
          else if (t.rank === 3) rankClass = "rank-3";

          leaderboardDiv.insertAdjacentHTML('beforeend', `
            <div class="trainer-card">
              
              <div class="card-header">
                <div class="trainer-info">
                  <div class="rank-circle ${rankClass}">${t.rank}</div>
                  <img src="${trainerImages[t.name] || ''}" alt="${t.name}" onerror="this.src='https://via.placeholder.com/60?text=?'">
                  <h4>${t.name}</h4>
                </div>
                
                <div class="total-score">
                  <div class="clients-count">${t.clients} Total Clients</div>
                  <div class="score-box">
                    <div class="score">${t.marks}</div>
                    <div class="label">Total Marks</div>
                  </div>
                </div>
              </div>

              <div class="breakdown-grid">
                <div class="stat-box stat-excellent">
                  <h5>Excellent</h5>
                  <div class="count">${t.Excellent}</div>
                </div>
                <div class="stat-box stat-good">
                  <h5>Good</h5>
                  <div class="count">${t.Good}</div>
                </div>
                <div class="stat-box stat-average">
                  <h5>Average</h5>
                  <div class="count">${t.Average}</div>
                </div>
                <div class="stat-box stat-needs">
                  <h5>Needs Improve</h5>
                  <div class="count">${t['Needs Improvement']}</div>
                </div>
                <div class="stat-box stat-poor">
                  <h5>Poor</h5>
                  <div class="count">${t.Poor}</div>
                </div>
              </div>

            </div>
          `);
        });
      })
      .catch(err => {
        document.getElementById('leaderboard').innerHTML = '<p style="text-align:center; color:red;">Error loading data. Check your URL.</p>';
      });
  </script>
</body>
</html>
