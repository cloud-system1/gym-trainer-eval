<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050805" />
  <title>Trainer Excellence Feedback</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap');

:root {
  --bg: #050805;
  --surface: rgba(18, 28, 21, 0.55);
  --surface-edge: rgba(255, 255, 255, 0.08);
  --text-main: #e8f5e9;
  --text-muted: #8bb393;
  --green-primary: #4caf50;
  --green-glow: rgba(76, 175, 80, 0.35);
  --blue: #2196f3;
  --yellow: #ffc107;
  --pink: #e91e63;
  --gray: #9e9e9e;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --header-h: 116px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  overflow: hidden;
  position: fixed;
  width: 100%;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Background ---------- */
.bg-container {
  position: fixed; inset: 0; z-index: -3;
  background-image: url('bg.jpg');
  background-size: cover;
  background-position: center;
  filter: blur(10px) brightness(0.35) saturate(1.1);
  transform: scale(1.1);
  animation: bgDrift 28s ease-in-out infinite alternate;
}
.bg-container::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(5,8,5,.75) 0%, rgba(8,24,14,.9) 100%);
}
/* soft glow that follows the rating colour */
.bg-glow {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(60% 50% at 50% 55%, var(--glow, rgba(76,175,80,.16)), transparent 70%);
  transition: background 0.8s ease;
}
@keyframes bgDrift { from { transform: scale(1.1) translate(0,0); } to { transform: scale(1.18) translate(-1.5%, 1%); } }

/* ---------- Header ---------- */
.app-header {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
  padding: env(safe-area-inset-top, 0px) 0 0;
  background: rgba(5, 8, 5, 0.55);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid rgba(76, 175, 80, 0.15);
  transition: transform 0.6s var(--ease-out);
}
.bar {
  max-width: 850px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px 12px;
}
.back-btn {
  width: 0; opacity: 0; overflow: hidden; flex: none;
  height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06); color: #fff; cursor: pointer;
  display: grid; place-items: center; padding: 0;
  transition: width .4s var(--ease-out), opacity .3s ease, margin .4s var(--ease-out), background .2s;
  margin-right: -12px;
}
.back-btn.visible { width: 38px; opacity: 1; margin-right: 0; }
.back-btn:hover { background: rgba(255,255,255,.14); }
.back-btn:active { transform: scale(.92); }

.header-text { flex: 1; min-width: 0; }
.header-text h1 { margin: 0; font-family: 'Sora', 'Inter', sans-serif; font-size: 1.15rem; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
.header-text p { margin: 2px 0 0; font-size: 0.82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.header-logo { height: 64px; width: auto; filter: drop-shadow(0 0 10px var(--green-glow)); }

/* Segmented progress – each segment takes the colour of its rating */
.progress {
  max-width: 850px; margin: 0 auto; padding: 0 20px 12px;
  display: flex; gap: 5px;
}
.progress i {
  flex: 1; height: 4px; border-radius: 4px; position: relative; overflow: hidden;
  background: rgba(255,255,255,.12);
  transition: transform .4s var(--ease-spring), background .4s;
}
.progress i::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: var(--sc, var(--green-primary));
  transform: scaleX(0); transform-origin: left;
  transition: transform .6s var(--ease-out);
}
.progress i.done::after { transform: scaleX(1); box-shadow: 0 0 10px var(--sc); }
.progress i.current { transform: scaleY(1.7); background: rgba(255,255,255,.3); }

/* ---------- Stage ---------- */
.survey-container {
  position: fixed; top: var(--header-h); bottom: 0; left: 0; right: 0;
  margin: 0 auto; max-width: 850px; padding: 0 16px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#survey-form, #trainer-cards { position: relative; width: 100%; height: 100%; }
#trainer-cards { display: flex; align-items: center; justify-content: center; perspective: 1400px; }

/* ---------- Card: slide + depth transitions ---------- */
.trainer-card {
  --rc: var(--green-primary);
  position: absolute; width: 100%;
  background: var(--surface);
  backdrop-filter: blur(20px) saturate(1.3);
  -webkit-backdrop-filter: blur(20px) saturate(1.3);
  border: 1px solid var(--surface-edge);
  border-radius: 28px;
  padding: 34px 36px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07);
  display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 44px;

  opacity: 0; visibility: hidden; pointer-events: none;
  transition:
    transform .75s var(--ease-out),
    opacity .5s ease,
    filter .6s ease,
    visibility 0s linear .75s;
  will-change: transform, opacity;
}
.trainer-card.upcoming { transform: translate3d(70px,0,-120px) rotateY(-10deg) scale(.94); filter: blur(6px); }
.trainer-card.past     { transform: translate3d(-70px,0,-120px) rotateY(10deg) scale(.94); filter: blur(6px); }
.trainer-card.active {
  opacity: 1; visibility: visible; pointer-events: auto;
  transform: none; filter: none;
  transition-delay: .08s, .08s, .08s, 0s;
}

/* ---------- Photo + ring ---------- */
.trainer-header { flex: 1.5; display: flex; flex-direction: column; align-items: center; gap: 6px; }

.photo-wrap { position: relative; width: min(380px, 52vh); height: min(380px, 52vh); }
.photo-clip {
  position: absolute; inset: 14px; border-radius: 50%; overflow: hidden;
  background: #1b241d;
  box-shadow: 0 18px 40px rgba(0,0,0,.55);
  transform: scale(.82); opacity: 0;
  transition: transform .9s var(--ease-spring) .15s, opacity .5s ease .15s;
}
.trainer-card.active .photo-clip { transform: scale(1); opacity: 1; }
.photo-clip img {
  width: 100%; height: 100%; display: block; object-fit: cover;
  transform: scale(var(--zoom, 1)); transform-origin: var(--origin, 50% 30%);
}

.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 2.5; }
.ring-track { stroke: rgba(255,255,255,.08); }
.ring-fg {
  stroke: var(--rc); stroke-linecap: round;
  stroke-dasharray: 346; stroke-dashoffset: 346;
  filter: drop-shadow(0 0 6px var(--rc));
  transition: stroke-dashoffset 1.1s var(--ease-out) .1s, stroke .5s ease, stroke-width .4s ease;
}
.trainer-card.active .ring-fg { stroke-dashoffset: 260; }          /* idle: partial arc */
.trainer-card.rated .ring-fg { stroke-dashoffset: 0; stroke-width: 4; } /* rated: closes in rating colour */
.trainer-card.rated:not(.active) .ring-fg { transition-duration: 0s; }

.trainer-name {
  margin: 14px 0 0; font-family: 'Sora', 'Inter', sans-serif;
  font-size: 2rem; font-weight: 700; color: #fff; text-align: center; letter-spacing: -0.02em;
}
.trainer-sub { margin: 0; color: var(--text-muted); font-size: .95rem; }

.trainer-name, .trainer-sub {
  opacity: 0; transform: translateY(14px);
  transition: opacity .6s ease .25s, transform .7s var(--ease-out) .25s;
}
.trainer-card.active .trainer-name,
.trainer-card.active .trainer-sub { opacity: 1; transform: none; }
.trainer-card.active .trainer-sub { transition-delay: .32s; }

/* ---------- Rating buttons ---------- */
.rating-options { flex: .8; display: flex; flex-direction: column; gap: 8px; }

.rating-btn {
  position: relative; display: flex; align-items: center; gap: 14px;
  padding: 11px 16px; border-radius: 14px; cursor: pointer; user-select: none; -webkit-user-select: none;
  font-weight: 600; font-size: .9rem; color: #fff;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  overflow: hidden;

  opacity: 0; transform: translateX(34px);
  transition:
    opacity .5s ease calc(.25s + var(--i) * .06s),
    transform .7s var(--ease-out) calc(.25s + var(--i) * .06s),
    background .25s ease, border-color .25s ease, box-shadow .3s ease, color .25s ease;
}
.trainer-card.active .rating-btn { opacity: 1; transform: none; }

.rating-btn .dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  background: var(--c); box-shadow: 0 0 10px var(--c);
  transition: transform .4s var(--ease-spring), background .25s, box-shadow .25s;
}
.rating-btn .label { flex: 1; }
.rating-btn kbd {
  font: 600 .72rem 'Inter', sans-serif; color: rgba(255,255,255,.4);
  border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 2px 7px;
  display: none;
}
@media (hover: hover) and (pointer: fine) { .rating-btn kbd { display: inline-block; } }

/* colour sweep on hover */
.rating-btn::before {
  content: ''; position: absolute; inset: 0; background: var(--c); opacity: 0;
  transition: opacity .25s ease;
}
.rating-btn:hover { border-color: var(--c); transform: translateX(4px); }
.rating-btn:hover::before { opacity: .1; }
.trainer-card.active .rating-btn:hover { transform: translateX(4px); }
.rating-btn:active { transform: scale(.97) !important; }

.rating-btn input { position: absolute; opacity: 0; width: 0; height: 0; }
.rating-btn > span, .rating-btn > kbd { position: relative; z-index: 1; }

.rating-btn:has(input:checked) {
  background: var(--c); border-color: var(--c);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent), 0 10px 30px color-mix(in srgb, var(--c) 45%, transparent);
  animation: pick .5s var(--ease-spring);
}
.rating-btn:has(input:checked)::before { opacity: 0; }
.rating-btn:has(input:checked) .dot { background: currentColor; box-shadow: none; transform: scale(.7); }
.rating-btn:has(input:checked) kbd { border-color: rgba(0,0,0,.25); color: inherit; }
.rating-btn.btn-excellent:has(input:checked),
.rating-btn.btn-average:has(input:checked),
.rating-btn.btn-poor:has(input:checked) { color: #0b0f0c; }
.rating-btn:has(input:focus-visible) { outline: 2px solid #fff; outline-offset: 3px; }

@keyframes pick {
  0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); }
}

/* ---------- Submit ---------- */
.submit-area {
  position: fixed; left: 0; bottom: 0; width: 100%;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(5,8,5,.95) 40%, rgba(5,8,5,0));
  z-index: 90; opacity: 0; pointer-events: none; transform: translateY(100%);
  transition: opacity .5s ease, transform .7s var(--ease-out);
}
.submit-area.show-submit { opacity: 1; pointer-events: auto; transform: none; }

button[type="submit"] {
  display: block; margin: 0 auto; max-width: 850px;
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #5fcf64, #2e9a3a); color: #04110a; border: none;
  padding: 18px 32px; font: 700 1.1rem 'Inter', sans-serif; border-radius: 18px;
  width: 100%; cursor: pointer;
  box-shadow: 0 14px 34px var(--green-glow), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .25s var(--ease-out), box-shadow .25s ease;
}
button[type="submit"]::after { /* slow shine sweep */
  content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite 1s;
}
button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(76,175,80,.5), inset 0 1px 0 rgba(255,255,255,.35); }
button[type="submit"]:active { transform: scale(.98); }
@keyframes shine { 0% { left: -60%; } 55%, 100% { left: 130%; } }

/* when submit bar is visible, lift the last card so nothing is covered */
#trainer-cards.on-last { padding-bottom: 0; }

/* ---------- Success popup ---------- */
.success-popup {
  display: none; position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(.8);
  background: rgba(10, 16, 12, 0.9); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(76,175,80,.5);
  padding: 40px 30px; border-radius: 32px; text-align: center;
  box-shadow: 0 0 80px rgba(76,175,80,.3), inset 0 1px 0 rgba(255,255,255,.08);
  z-index: 2000; width: 90%; max-width: 420px; opacity: 0;
  transition: opacity .4s ease, transform .6s var(--ease-spring);
}
.success-popup.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
body.is-done .survey-container { filter: blur(8px) brightness(.6); transition: filter .6s ease; }
body.is-done .submit-area { opacity: 0; }

.success-icon-ring {
  width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 24px;
  display: grid; place-items: center; color: var(--green-primary);
  background: radial-gradient(circle, rgba(76,175,80,.2), rgba(76,175,80,.04));
  box-shadow: 0 0 0 2px rgba(76,175,80,.6), 0 0 40px var(--green-glow);
  position: relative;
}
.success-icon-ring::after { /* expanding pulse */
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--green-primary); opacity: 0;
}
.success-popup.show .success-icon-ring::after { animation: pulse 1.4s ease-out .5s 2; }
.check { width: 52px; height: 52px; }
.check path { stroke-dasharray: 48; stroke-dashoffset: 48; }
.success-popup.show .check path { animation: draw .6s var(--ease-out) .35s forwards; }
.success-popup h2 { margin: 0 0 10px; color: #fff; font: 700 1.5rem 'Sora', 'Inter', sans-serif; }
.success-popup p { color: var(--text-muted); margin: 0; font-size: 1rem; line-height: 1.5; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }

/* ---------- Mobile ---------- */
@media (max-width: 768px) {
  :root { --header-h: 100px; }
  .bar { padding: 12px 16px 10px; }
  .progress { padding: 0 16px 10px; }
  .header-text h1 { font-size: 1rem; }
  .header-logo { height: 50px; }

  .survey-container { padding: 0 12px; }
  .trainer-card {
    flex-direction: column; padding: 20px 18px; gap: 16px; border-radius: 24px;
  }
  .trainer-header { gap: 2px; }
  .photo-wrap { width: min(230px, 30vh); height: min(230px, 30vh); }
  .photo-clip { inset: 9px; }
  .trainer-name { font-size: 1.5rem; margin-top: 8px; }
  .trainer-sub { font-size: .85rem; }
  .rating-options { width: 100%; gap: 7px; flex: none; }
  .rating-btn { padding: 10px 16px; font-size: .88rem; border-radius: 13px; }
  button[type="submit"] { padding: 16px; font-size: 1rem; border-radius: 14px; }
}

@media (max-height: 640px) and (max-width: 768px) {
  .photo-wrap { width: 160px; height: 160px; }
  .trainer-sub { display: none; }
  .rating-btn { padding: 8px 14px; }
}

/* ---------- Accessibility ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}

  </style>
</head>
<body>

  <div class="bg-container" id="bg-zoom"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="app-header" id="main-header">
    <div class="bar">
      <button type="button" class="back-btn" id="back-btn" aria-label="Previous trainer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="header-text">
        <h1>Trainer Excellence Feedback</h1>
        <p id="step-label">Trainer 1 of 11</p>
      </div>
      <img src="logo.png" alt="High Impact Gym" class="header-logo">
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <main class="survey-container" id="scroll-container">
    <form id="survey-form" novalidate>
      <div id="trainer-cards"></div>
      <div class="submit-area" id="submit-area">
        <button type="submit" id="submit-btn">Complete Evaluation</button>
      </div>
    </form>
  </main>

  <div id="success-popup" class="success-popup" role="status">
    <div class="success-icon-ring">
      <svg class="check" viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 27l8 8 16-17"/>
      </svg>
    </div>
    <h2>Feedback Sent!</h2>
    <p>Your evaluation has been securely recorded.<br>Thank you for shaping the High Impact experience!</p>
  </div>

  <script>
    const trainers = [
      { id: "5", name: "Bhagya", img: "assets/trainers/bhagya.jpg", },
      { id: "1", name: "Sameera", img: "assets/trainers/Sameera.jpg", },
      { id: "2", name: "Kavindu", img: "assets/trainers/Kavindu.jpg" },
      { id: "3", name: "Dilshan", img: "assets/trainers/Dilshan.jpg" },
      { id: "10", name: "Sasanka", img: "assets/trainers/Sasanka.jpg" },
      { id: "4", name: "Ravija", img: "assets/trainers/Ravija.jpg" },
      { id: "8", name: "Thilini", img: "assets/trainers/Thilini.jpg" },
      { id: "6", name: "Hiruka", img: "assets/trainers/Hiruka.jpg" },
      { id: "7", name: "Shalani", img: "assets/trainers/Shalani.jpg" },
      { id: "9", name: "Pavani", img: "assets/trainers/pavani.jpg", },
      { id: "11", name: "Methum", img: "assets/trainers/Methum.jpg" }
    ];

    const ratings = ["Excellent", "Good", "Average", "Needs Improvement", "Poor"];
    const ratingClasses = ['btn-excellent', 'btn-good', 'btn-average', 'btn-needs', 'btn-poor'];
    const ratingColors = ['#4caf50', '#2196f3', '#ffc107', '#e91e63', '#9e9e9e'];

    const container = document.getElementById('trainer-cards');
    const progress = document.getElementById('progress');
    const stepLabel = document.getElementById('step-label');
    const backBtn = document.getElementById('back-btn');
    const header = document.getElementById('main-header');
    const submitArea = document.getElementById('submit-area');
    const form = document.getElementById('survey-form');

    const totalTrainers = trainers.length;
    let currentIndex = 0;
    let advanceTimer = null;

    // Build progress segments
    trainers.forEach(() => {
      const s = document.createElement('i');
      progress.appendChild(s);
    });
    const segments = progress.querySelectorAll('i');

    // Build cards
    trainers.forEach((t, index) => {
      const card = document.createElement('section');
      card.className = 'trainer-card upcoming';
      card.dataset.index = index;

      let buttonsHTML = '';
      ratings.forEach((r, i) => {
        buttonsHTML += `
          <label class="rating-btn ${ratingClasses[i]}" style="--i:${i}; --c:${ratingColors[i]}">
            <input type="radio" name="trainer_${t.id}" value="${r}">
            <span class="dot"></span>
            <span class="label">${r}</span>
            <kbd>${i + 1}</kbd>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="trainer-header">
          <div class="photo-wrap">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-track" cx="60" cy="60" r="55"/>
              <circle class="ring-fg" cx="60" cy="60" r="55"/>
            </svg>
            <div class="photo-clip">
              <img src="${t.img}" alt="${t.name}" style="--zoom:${t.zoom || 1}; --origin:${t.origin || '50% 30%'}" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${t.name}&background=4caf50&color=fff&size=300'">
            </div>
          </div>
          <h2 class="trainer-name">${t.name}</h2>
          <p class="trainer-sub">How was your experience?</p>
        </div>
        <div class="rating-options" role="radiogroup" aria-label="Rate ${t.name}">
          ${buttonsHTML}
        </div>
      `;
      container.appendChild(card);
    });

    const cards = container.querySelectorAll('.trainer-card');

    function allAnswered() {
      return trainers.every(t => form.querySelector(`input[name="trainer_${t.id}"]:checked`));
    }

    function go(i) {
      currentIndex = i;
      cards.forEach((c, k) => {
        c.classList.toggle('active', k === i);
        c.classList.toggle('past', k < i);
        c.classList.toggle('upcoming', k > i);
        c.inert = k !== i;
      });
      stepLabel.textContent = `Trainer ${i + 1} of ${totalTrainers}`;
      backBtn.classList.toggle('visible', i > 0);
      segments.forEach((s, k) => s.classList.toggle('current', k === i));
      submitArea.classList.toggle('show-submit', i === totalTrainers - 1 && allAnswered());
      container.classList.toggle('on-last', i === totalTrainers - 1);
    }

    function selectRating(card, input) {
      const idx = Number(card.dataset.index);
      const rIdx = ratings.indexOf(input.value);
      card.style.setProperty('--rc', ratingColors[rIdx]);
      card.classList.add('rated');
      segments[idx].style.setProperty('--sc', ratingColors[rIdx]);
      segments[idx].classList.add('done');
      if (navigator.vibrate) navigator.vibrate(12);

      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => {
        if (idx < totalTrainers - 1) go(idx + 1);
        else submitArea.classList.add('show-submit');
      }, 520);
    }

    container.addEventListener('change', (e) => {
      if (e.target.type !== 'radio') return;
      header.classList.add('compact');
      selectRating(e.target.closest('.trainer-card'), e.target);
    });

    backBtn.addEventListener('click', () => {
      clearTimeout(advanceTimer);
      if (currentIndex > 0) go(currentIndex - 1);
    });

    // Keyboard: 1-5 to rate, arrows to navigate
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = Number(e.key);
      if (n >= 1 && n <= 5) {
        const input = cards[currentIndex].querySelectorAll('input')[n - 1];
        if (input) { input.checked = true; input.dispatchEvent(new Event('change', { bubbles: true })); }
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        clearTimeout(advanceTimer); go(currentIndex - 1);
      } else if (e.key === 'ArrowRight' && form.querySelector(`input[name="trainer_${trainers[currentIndex].id}"]:checked`) && currentIndex < totalTrainers - 1) {
        clearTimeout(advanceTimer); go(currentIndex + 1);
      }
    });

    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwbKqZy4tFHBlVZpSUHDtsejeTTPPLGgrzsuuNL5cbNKB3xBxHK9BM5MHfzMYcaloM/exec';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const popup = document.getElementById('success-popup');

      // If anything was skipped (e.g. after going back), jump to it
      const missing = trainers.findIndex(t => !form.querySelector(`input[name="trainer_${t.id}"]:checked`));
      if (missing !== -1) { go(missing); return; }

      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);
      const payload = { timestamp: new Date().toISOString(), ratings: {} };
      trainers.forEach(t => {
        payload.ratings[t.name] = formData.get(`trainer_${t.id}`);
      });

      popup.classList.add('show');
      document.body.classList.add('is-done');

      try {
        fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.log("Background submission error:", error);
      }

      setTimeout(() => {
        popup.classList.remove('show');
        document.body.classList.remove('is-done');
        e.target.reset();
        cards.forEach(c => { c.classList.remove('rated'); c.style.removeProperty('--rc'); });
        segments.forEach(s => { s.classList.remove('done'); s.style.removeProperty('--sc'); });
        btn.textContent = 'Complete Evaluation';
        header.classList.remove('compact');
        go(0);
      }, 4500);
    });

    // ---------------------------------------------------------------
    // 🎯 PHOTO TUNER — open the page with  ?tune  at the end of the URL
    // e.g. https://your-site/index.html?tune
    // Adjust each trainer until the face size matches Kavindu, then Copy.
    // ---------------------------------------------------------------
    if (new URLSearchParams(location.search).has('tune')) {
      trainers.forEach(t => {
        const o = (t.origin || '50% 30%').split(' ').map(parseFloat);
        t.zoom = t.zoom || 1; t.ox = o[0]; t.oy = o[1];
      });

      const panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5000;background:rgba(10,16,12,.96);border:1px solid #4caf50;border-radius:16px;padding:10px;color:#fff;font:600 13px Inter,system-ui,sans-serif;max-width:520px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.6)';
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span><b id="tp-name"></b> &nbsp;<span id="tp-vals" style="opacity:.8"></span></span>
          <span style="opacity:.7">Tune mode</span>
        </div>
        <div class="tp-row"><button data-a="z-">Zoom −</button><button data-a="z+">Zoom +</button><button data-a="u">↑</button><button data-a="d">↓</button><button data-a="l">←</button><button data-a="r">→</button></div>
        <div class="tp-row"><button data-a="prev">◀ Prev</button><button data-a="next">Next ▶</button><button data-a="reset">Reset</button><button data-a="copy" style="background:#4caf50;color:#04110a">Copy all</button></div>`;
      const st = document.createElement('style');
      st.textContent = '.tp-row{display:flex;gap:6px;margin-top:6px}.tp-row button{flex:1;padding:11px 4px;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}.tp-row button:active{transform:scale(.94)}';
      document.head.appendChild(st);
      document.body.appendChild(panel);

      const baseline = trainers.map(t => ({ zoom: t.zoom, ox: t.ox, oy: t.oy }));
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

      function applyPhoto(i) {
        const t = trainers[i], img = cards[i].querySelector('img');
        img.style.setProperty('--zoom', t.zoom);
        img.style.setProperty('--origin', t.ox + '% ' + t.oy + '%');
      }
      function updatePanel() {
        const t = trainers[currentIndex];
        panel.querySelector('#tp-name').textContent = t.name;
        panel.querySelector('#tp-vals').textContent = 'zoom ' + t.zoom.toFixed(2) + ' · ' + t.ox + '% ' + t.oy + '%';
      }

      const _go = go;
      go = function (i) { _go(i); updatePanel(); };

      panel.addEventListener('click', (e) => {
        const a = e.target.dataset && e.target.dataset.a;
        if (!a) return;
        const t = trainers[currentIndex];
        if (a === 'z+') t.zoom = clamp(+(t.zoom + 0.1).toFixed(2), 1, 4);
        if (a === 'z-') t.zoom = clamp(+(t.zoom - 0.1).toFixed(2), 1, 4);
        if (a === 'u') t.oy = clamp(t.oy + 5, 0, 100);   // moves the photo up
        if (a === 'd') t.oy = clamp(t.oy - 5, 0, 100);   // moves the photo down
        if (a === 'l') t.ox = clamp(t.ox + 5, 0, 100);   // moves the photo left
        if (a === 'r') t.ox = clamp(t.ox - 5, 0, 100);   // moves the photo right
        if (a === 'reset') Object.assign(t, baseline[currentIndex]);
        if (a === 'prev' && currentIndex > 0) { go(currentIndex - 1); return; }
        if (a === 'next' && currentIndex < totalTrainers - 1) { go(currentIndex + 1); return; }
        if (a === 'copy') {
          const lines = trainers.map(t => {
            const extra = (t.zoom !== 1 ? ', zoom: ' + t.zoom : '') + ((t.ox !== 50 || t.oy !== 30) ? ', origin: "' + t.ox + '% ' + t.oy + '%"' : '');
            return '      { id: "' + t.id + '", name: "' + t.name + '", img: "' + t.img + '"' + extra + ' }';
          });
          const text = 'const trainers = [\n' + lines.join(',\n') + '\n    ];';
          (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
            () => alert('Copied! Paste it here in the chat.'),
            () => prompt('Copy this text and paste it in the chat:', text)
          );
          return;
        }
        applyPhoto(currentIndex);
        updatePanel();
      });

      updatePanel();
    }

    go(0);
  </script>
</body>
</html>
