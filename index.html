<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer Excellence Feedback</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
<div class="bg-container" id="bg-zoom"></div>
  
  <header class="app-header" id="main-header">
      <div class="header-text">
      <h1>Trainer Excellence Feedback</h1>
      <p>Help us recognize excellence by rating your instructor's performance and professionalism.</p>
    </div>
    <img src="logo.png" alt="High Impact Gym" class="header-logo">
  </header>

  <main class="survey-container" id="scroll-container">
    <form id="survey-form">
      <div id="trainer-cards"></div>
      
      <!-- The button is hidden by default. It will slide up when all 10 are rated. -->
      <div class="submit-area" id="submit-area">
        <button type="submit" id="submit-btn">Complete Evaluation</button>
      </div>
    </form>
  </main>

  <!-- 🎉 The Creative Success Popup -->
   <div id="success-popup" class="success-popup">
    <div class="success-icon-ring">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 36px; height: 36px;">
          <path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6"/>
          <rect x="6.5" y="8.5" width="11" height="7" rx="1.5"/>
        </svg>
      </div>
    </div>
    <h2>Feedback Sent!</h2>
    <p>Your evaluation has been securely recorded.<br>Thank you for shaping the High Impact experience!</p>
  </div>

  <script>
    // 1. SCROLL EFFECTS (Listening to the survey container, not the window)
    let lastScrollTop = 0;
    const header = document.getElementById('main-header');
    const bgZoom = document.getElementById('bg-zoom');
    const scrollContainer = document.getElementById('scroll-container');

    // We listen to the container scrolling (since overflow-y is on the container)
    scrollContainer.addEventListener('scroll', function() {
      let scrollTop = scrollContainer.scrollTop;
      
      // A. Hide/Show Header
      if (scrollTop > lastScrollTop && scrollTop > 50) {
        header.classList.add('header-hidden'); // Scroll down -> Hide
      } else {
        header.classList.remove('header-hidden'); // Scroll up -> Show
      }
      lastScrollTop = scrollTop;

      // B. Continuous Background Zoom Effect
      if (bgZoom) {
        let maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
        if (maxScroll > 0) {
          let scrollPercent = scrollTop / maxScroll; 
          let scale = 1 + (scrollPercent * 1.5); 
          bgZoom.style.transform = `scale(${scale})`;
        }
      }
    });

    // 2. BUILD THE TRAINER CARDS
        const trainers = [
      { id: "1", name: "Sameera", img: "assets/trainers/Sameera.jpg" },
      { id: "2", name: "Kavindu", img: "assets/trainers/Kavindu.jpg" },
      { id: "3", name: "Dilshan", img: "assets/trainers/Dilshan.jpg" },
      { id: "4", name: "Ravija", img: "assets/trainers/Ravija.jpg" },
      { id: "5", name: "Bhagya", img: "assets/trainers/bhagya.jpg" },
      { id: "6", name: "Hiruka", img: "assets/trainers/Hiruka.jpg" },
      { id: "7", name: "Shalani", img: "assets/trainers/Shalani.jpg" },
      { id: "8", name: "Thilini", img: "assets/trainers/Thilini.jpg" },
      { id: "9", name: "Pavani", img: "assets/trainers/pavani.jpg" },
      { id: "10", name: "Sasanka", img: "assets/trainers/Sasanka.jpg" },
      { id: "11", name: "Methum", img: "assets/trainers/Methum.jpg" }
    ];

    const ratings = ["Excellent", "Good", "Average", "Needs Improvement", "Poor"];
    const container = document.getElementById('trainer-cards');
    
    trainers.forEach((t, index) => {
      const card = document.createElement('div');
      card.className = 'trainer-card';
      
      let buttonsHTML = '';
      ratings.forEach((r, i) => {
        const colorClass = ['btn-excellent', 'btn-good', 'btn-average', 'btn-needs', 'btn-poor'][i];
        buttonsHTML += `
          <label class="rating-btn ${colorClass}">
            <input type="radio" name="trainer_${t.id}" value="${r}" required>
            <span>${r}</span>
          </label>
        `;
      });

            card.innerHTML = `
        <div class="trainer-header">
          <img src="${t.img}" alt="${t.name}" onerror="this.src='https://ui-avatars.com/api/?name=${t.name}&background=4caf50&color=fff&size=150'">
        </div>
        <div class="rating-options">
          ${buttonsHTML}
        </div>
      `;
      
      container.appendChild(card);
    });

    // 3. CHECK IF ALL TRAINERS ARE RATED BEFORE SHOWING BUTTON
    const submitArea = document.getElementById('submit-area');
    const formElement = document.getElementById('survey-form');

    formElement.addEventListener('change', () => {
      let answeredCount = 0;
      
      trainers.forEach(t => {
        const selected = document.querySelector(`input[name="trainer_${t.id}"]:checked`);
        if (selected) {
          answeredCount++;
        }
      });

      if (answeredCount === trainers.length) {
        submitArea.classList.add('show-submit');
      } else {
        submitArea.classList.remove('show-submit');
      }
    });

    // 4. SUBMIT FORM (5 SECOND POPUP + BACKGROUND SEND)
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwbKqZy4tFHBlVZpSUHDtsejeTTPPLGgrzsuuNL5cbNKB3xBxHK9BM5MHfzMYcaloM/exec'; 

    document.getElementById('survey-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const popup = document.getElementById('success-popup');
      
      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);
      const payload = { timestamp: new Date().toISOString(), ratings: {} };
      
      trainers.forEach(t => {
        payload.ratings[t.name] = formData.get(`trainer_${t.id}`);
      });

      // Show the popup immediately
      popup.classList.add('show');
      
      // Reset the form instantly in the background
      e.target.reset(); 
      submitArea.classList.remove('show-submit'); 
      
      // 🟢 Wait exactly 5 seconds (5000ms) before hiding the popup
      setTimeout(() => {
        popup.classList.remove('show');
        btn.textContent = 'Complete Evaluation';
        // Scroll back to top smoothly
        scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
      }, 5000); 

      // Send data in background
      try {
        fetch(ENDPOINT, { 
          method: 'POST', 
          mode: 'no-cors', 
          body: JSON.stringify(payload) 
        });
      } catch (error) {
        console.log("Background submission error:", error);
      }
    });
  </script>
</body>
</html>
