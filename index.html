<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050805" />
  <title>Trainer Excellence Feedback</title>
  <link rel="stylesheet" href="style-final.css?v=31" />
</head>
<body>

  <div class="bg-container" id="bg-zoom"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="app-header" id="main-header">
    <div class="bar">
      <button type="button" class="back-btn" id="back-btn" aria-label="Previous trainer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="header-text">
        <h1>Trainer Excellence Feedback</h1>
        <p id="step-label">Trainer 1 of 11</p>
      </div>
      <img src="logo.png" alt="High Impact Gym" class="header-logo">
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <main class="survey-container" id="scroll-container">
    <form id="survey-form" novalidate>
      <div id="trainer-cards"></div>
      <div class="submit-area" id="submit-area">
        <button type="submit" id="submit-btn">Complete Evaluation</button>
      </div>
    </form>
  </main>

  <div id="success-popup" class="success-popup" role="status">
    <div class="success-icon-ring">
      <svg class="check" viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 27l8 8 16-17"/>
      </svg>
    </div>
    <h2>Feedback Sent!</h2>
    <p>Your evaluation has been securely recorded.<br>Thank you for shaping the High Impact experience!</p>
  </div>

  <script>
    const trainers = [
      { id: "1", name: "Sameera", img: "assets/trainers/Sameera.jpg", zoom: 1.5 },
      { id: "2", name: "Kavindu", img: "assets/trainers/Kavindu.jpg" },
      { id: "3", name: "Dilshan", img: "assets/trainers/Dilshan.jpg" },
      { id: "4", name: "Ravija", img: "assets/trainers/Ravija.jpg" },
      { id: "5", name: "Bhagya", img: "assets/trainers/bhagya.jpg", zoom: 1.5 },
      { id: "6", name: "Hiruka", img: "assets/trainers/Hiruka.jpg" },
      { id: "7", name: "Shalani", img: "assets/trainers/Shalani.jpg" },
      { id: "8", name: "Thilini", img: "assets/trainers/Thilini.jpg" },
      { id: "9", name: "Pavani", img: "assets/trainers/pavani.jpg", zoom: 1.5 },
      { id: "10", name: "Sasanka", img: "assets/trainers/Sasanka.jpg" },
      { id: "11", name: "Methum", img: "assets/trainers/Methum.jpg" }
    ];

    const ratings = ["Excellent", "Good", "Average", "Needs Improvement", "Poor"];
    const ratingClasses = ['btn-excellent', 'btn-good', 'btn-average', 'btn-needs', 'btn-poor'];
    const ratingColors = ['#4caf50', '#2196f3', '#ffc107', '#e91e63', '#9e9e9e'];

    const container = document.getElementById('trainer-cards');
    const progress = document.getElementById('progress');
    const stepLabel = document.getElementById('step-label');
    const backBtn = document.getElementById('back-btn');
    const header = document.getElementById('main-header');
    const submitArea = document.getElementById('submit-area');
    const form = document.getElementById('survey-form');

    const totalTrainers = trainers.length;
    let currentIndex = 0;
    let advanceTimer = null;

    // Build progress segments
    trainers.forEach(() => {
      const s = document.createElement('i');
      progress.appendChild(s);
    });
    const segments = progress.querySelectorAll('i');

    // Build cards
    trainers.forEach((t, index) => {
      const card = document.createElement('section');
      card.className = 'trainer-card upcoming';
      card.dataset.index = index;

      let buttonsHTML = '';
      ratings.forEach((r, i) => {
        buttonsHTML += `
          <label class="rating-btn ${ratingClasses[i]}" style="--i:${i}; --c:${ratingColors[i]}">
            <input type="radio" name="trainer_${t.id}" value="${r}">
            <span class="dot"></span>
            <span class="label">${r}</span>
            <kbd>${i + 1}</kbd>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="trainer-header">
          <div class="photo-wrap">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-track" cx="60" cy="60" r="55"/>
              <circle class="ring-fg" cx="60" cy="60" r="55"/>
            </svg>
            <div class="photo-clip">
              <img src="${t.img}" alt="${t.name}" style="--zoom:${t.zoom || 1}; --origin:${t.origin || '50% 30%'}" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${t.name}&background=4caf50&color=fff&size=300'">
            </div>
          </div>
          <h2 class="trainer-name">${t.name}</h2>
          <p class="trainer-sub">How was your experience?</p>
        </div>
        <div class="rating-options" role="radiogroup" aria-label="Rate ${t.name}">
          ${buttonsHTML}
        </div>
      `;
      container.appendChild(card);
    });

    const cards = container.querySelectorAll('.trainer-card');

    function allAnswered() {
      return trainers.every(t => form.querySelector(`input[name="trainer_${t.id}"]:checked`));
    }

    function go(i) {
      currentIndex = i;
      cards.forEach((c, k) => {
        c.classList.toggle('active', k === i);
        c.classList.toggle('past', k < i);
        c.classList.toggle('upcoming', k > i);
        c.inert = k !== i;
      });
      stepLabel.textContent = `Trainer ${i + 1} of ${totalTrainers}`;
      backBtn.classList.toggle('visible', i > 0);
      segments.forEach((s, k) => s.classList.toggle('current', k === i));
      submitArea.classList.toggle('show-submit', i === totalTrainers - 1 && allAnswered());
      container.classList.toggle('on-last', i === totalTrainers - 1);
    }

    function selectRating(card, input) {
      const idx = Number(card.dataset.index);
      const rIdx = ratings.indexOf(input.value);
      card.style.setProperty('--rc', ratingColors[rIdx]);
      card.classList.add('rated');
      segments[idx].style.setProperty('--sc', ratingColors[rIdx]);
      segments[idx].classList.add('done');
      if (navigator.vibrate) navigator.vibrate(12);

      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => {
        if (idx < totalTrainers - 1) go(idx + 1);
        else submitArea.classList.add('show-submit');
      }, 520);
    }

    container.addEventListener('change', (e) => {
      if (e.target.type !== 'radio') return;
      header.classList.add('compact');
      selectRating(e.target.closest('.trainer-card'), e.target);
    });

    backBtn.addEventListener('click', () => {
      clearTimeout(advanceTimer);
      if (currentIndex > 0) go(currentIndex - 1);
    });

    // Keyboard: 1-5 to rate, arrows to navigate
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = Number(e.key);
      if (n >= 1 && n <= 5) {
        const input = cards[currentIndex].querySelectorAll('input')[n - 1];
        if (input) { input.checked = true; input.dispatchEvent(new Event('change', { bubbles: true })); }
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        clearTimeout(advanceTimer); go(currentIndex - 1);
      } else if (e.key === 'ArrowRight' && form.querySelector(`input[name="trainer_${trainers[currentIndex].id}"]:checked`) && currentIndex < totalTrainers - 1) {
        clearTimeout(advanceTimer); go(currentIndex + 1);
      }
    });

    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwbKqZy4tFHBlVZpSUHDtsejeTTPPLGgrzsuuNL5cbNKB3xBxHK9BM5MHfzMYcaloM/exec';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const popup = document.getElementById('success-popup');

      // If anything was skipped (e.g. after going back), jump to it
      const missing = trainers.findIndex(t => !form.querySelector(`input[name="trainer_${t.id}"]:checked`));
      if (missing !== -1) { go(missing); return; }

      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);
      const payload = { timestamp: new Date().toISOString(), ratings: {} };
      trainers.forEach(t => {
        payload.ratings[t.name] = formData.get(`trainer_${t.id}`);
      });

      popup.classList.add('show');
      document.body.classList.add('is-done');

      try {
        fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.log("Background submission error:", error);
      }

      setTimeout(() => {
        popup.classList.remove('show');
        document.body.classList.remove('is-done');
        e.target.reset();
        cards.forEach(c => { c.classList.remove('rated'); c.style.removeProperty('--rc'); });
        segments.forEach(s => { s.classList.remove('done'); s.style.removeProperty('--sc'); });
        btn.textContent = 'Complete Evaluation';
        header.classList.remove('compact');
        go(0);
      }, 4500);
    });

    // ---------------------------------------------------------------
    // 🎯 PHOTO TUNER — open the page with  ?tune  at the end of the URL
    // e.g. https://your-site/index.html?tune
    // Adjust each trainer until the face size matches Kavindu, then Copy.
    // ---------------------------------------------------------------
    if (new URLSearchParams(location.search).has('tune')) {
      trainers.forEach(t => {
        const o = (t.origin || '50% 30%').split(' ').map(parseFloat);
        t.zoom = t.zoom || 1; t.ox = o[0]; t.oy = o[1];
      });

      const panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5000;background:rgba(10,16,12,.96);border:1px solid #4caf50;border-radius:16px;padding:10px;color:#fff;font:600 13px Inter,system-ui,sans-serif;max-width:520px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.6)';
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span><b id="tp-name"></b> &nbsp;<span id="tp-vals" style="opacity:.8"></span></span>
          <span style="opacity:.7">Tune mode</span>
        </div>
        <div class="tp-row"><button data-a="z-">Zoom −</button><button data-a="z+">Zoom +</button><button data-a="u">↑</button><button data-a="d">↓</button><button data-a="l">←</button><button data-a="r">→</button></div>
        <div class="tp-row"><button data-a="prev">◀ Prev</button><button data-a="next">Next ▶</button><button data-a="reset">Reset</button><button data-a="copy" style="background:#4caf50;color:#04110a">Copy all</button></div>`;
      const st = document.createElement('style');
      st.textContent = '.tp-row{display:flex;gap:6px;margin-top:6px}.tp-row button{flex:1;padding:11px 4px;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}.tp-row button:active{transform:scale(.94)}';
      document.head.appendChild(st);
      document.body.appendChild(panel);

      const baseline = trainers.map(t => ({ zoom: t.zoom, ox: t.ox, oy: t.oy }));
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

      function applyPhoto(i) {
        const t = trainers[i], img = cards[i].querySelector('img');
        img.style.setProperty('--zoom', t.zoom);
        img.style.setProperty('--origin', t.ox + '% ' + t.oy + '%');
      }
      function updatePanel() {
        const t = trainers[currentIndex];
        panel.querySelector('#tp-name').textContent = t.name;
        panel.querySelector('#tp-vals').textContent = 'zoom ' + t.zoom.toFixed(2) + ' · ' + t.ox + '% ' + t.oy + '%';
      }

      const _go = go;
      go = function (i) { _go(i); updatePanel(); };

      panel.addEventListener('click', (e) => {
        const a = e.target.dataset && e.target.dataset.a;
        if (!a) return;
        const t = trainers[currentIndex];
        if (a === 'z+') t.zoom = clamp(+(t.zoom + 0.1).toFixed(2), 1, 4);
        if (a === 'z-') t.zoom = clamp(+(t.zoom - 0.1).toFixed(2), 1, 4);
        if (a === 'u') t.oy = clamp(t.oy + 5, 0, 100);   // moves the photo up
        if (a === 'd') t.oy = clamp(t.oy - 5, 0, 100);   // moves the photo down
        if (a === 'l') t.ox = clamp(t.ox + 5, 0, 100);   // moves the photo left
        if (a === 'r') t.ox = clamp(t.ox - 5, 0, 100);   // moves the photo right
        if (a === 'reset') Object.assign(t, baseline[currentIndex]);
        if (a === 'prev' && currentIndex > 0) { go(currentIndex - 1); return; }
        if (a === 'next' && currentIndex < totalTrainers - 1) { go(currentIndex + 1); return; }
        if (a === 'copy') {
          const lines = trainers.map(t => {
            const extra = (t.zoom !== 1 ? ', zoom: ' + t.zoom : '') + ((t.ox !== 50 || t.oy !== 30) ? ', origin: "' + t.ox + '% ' + t.oy + '%"' : '');
            return '      { id: "' + t.id + '", name: "' + t.name + '", img: "' + t.img + '"' + extra + ' }';
          });
          const text = 'const trainers = [\n' + lines.join(',\n') + '\n    ];';
          (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
            () => alert('Copied! Paste it here in the chat.'),
            () => prompt('Copy this text and paste it in the chat:', text)
          );
          return;
        }
        applyPhoto(currentIndex);
        updatePanel();
      });

      updatePanel();
    }

    go(0);
  </script>
</body>
</html>
