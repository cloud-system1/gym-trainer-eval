<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer Excellence Feedback</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1>Trainer Excellence Feedback</h1>
    <p>Help us recognize excellence by rating your instructor's performance and professionalism.</p>
  </header>

  <main class="survey-container">
    <form id="survey-form">
      
      <!-- The form is generated by JavaScript below -->
      <div id="trainer-cards"></div>

      <div class="submit-area">
        <button type="submit" id="submit-btn">Submit All Feedback</button>
        <p id="msg" class="msg"></p>
      </div>
    </form>
  </main>

  <footer>
    <p>Thank you for helping us shape a high-quality training environment!</p>
  </footer>

  <script>
    // 1. Trainer Data
    const trainers = [
      { id: "1", name: "Sameera", img: "Sameera.png" },
      { id: "2", name: "Chamindu", img: "Chamindu.png" },
      { id: "3", name: "Kavindu", img: "Kavindu.png" },
      { id: "4", name: "Ravija", img: "Ravija.png" },
      { id: "5", name: "Bhagya", img: "bhagya.png" },
      { id: "6", name: "Dilshan", img: "Dilshan.png" },
      { id: "7", name: "Pavani", img: "pavani.png" },
      { id: "8", name: "Thilini", img: "Thilini.png" },
      { id: "9", name: "Hiruka", img: "Hiruka.png" },
      { id: "10", name: "Shalani", img: "Shalani.png" }
    ];

    const ratings = ["Excellent", "Good", "Average", "Needs Improvement", "Poor"];
    
    // 2. Build the UI
    const container = document.getElementById('trainer-cards');
    
    trainers.forEach((t, index) => {
      const card = document.createElement('div');
      card.className = 'trainer-card';
      
      let buttonsHTML = '';
      ratings.forEach((r, i) => {
        // Color coding the buttons
        const colorClass = ['btn-excellent', 'btn-good', 'btn-average', 'btn-needs', 'btn-poor'][i];
        buttonsHTML += `
          <label class="rating-btn ${colorClass}">
            <input type="radio" name="trainer_${t.id}" value="${r}" required>
            <span>${r}</span>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="trainer-header">
          <img src="${t.img}" alt="${t.name}" onerror="this.src='https://via.placeholder.com/80?text=No+Photo'">
          <h2>${t.name}</h2>
        </div>
        <div class="rating-options">
          ${buttonsHTML}
        </div>
      `;
      
      container.appendChild(card);
    });

    // 3. Handle Submission
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbw0Bk14VLgVA8MKlkCzbDvCL4sJT1Ol5xrXMIi9XEt8dS3onIN3Z4E596xjkN7sgvtt/exec'; 

    document.getElementById('survey-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      
      btn.disabled = true;
      msg.textContent = 'Submitting...';

      const formData = new FormData(e.target);
      const payload = { timestamp: new Date().toISOString(), ratings: {} };
      
      trainers.forEach(t => {
        payload.ratings[t.name] = formData.get(`trainer_${t.id}`);
      });

      if (ENDPOINT === 'PASTE_YOUR_WEB_APP_URL_HERE') {
        msg.textContent = 'Test Mode: Form works! Connect Google Sheets to save data.';
        btn.disabled = false;
        return;
      }

      try {
        const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.ok) {
          msg.textContent = 'Thank you! Your feedback has been recorded.';
          e.target.reset();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          msg.textContent = data.error || 'Something went wrong.';
        }
      } catch {
        msg.textContent = 'Network error — please try again.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
