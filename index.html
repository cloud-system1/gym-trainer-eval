<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer Excellence Feedback</title>
  <link rel="stylesheet" href="style.css?v=9" />
  <style>
    /* 🟢 PREMIUM SLIDER STYLES */
    .survey-container {
      overflow: hidden; /* Hide the scrollbar */
      height: calc(100vh - 120px);
      display: flex;
      align-items: center; 
      justify-content: center;
      position: relative;
      max-width: 650px;
      margin: 120px auto 0;
      padding: 0;
      /* Remove scroll snapping that was here before */
      scroll-snap-type: none; 
      overflow-y: hidden;
    }
    
    #trainer-cards {
      display: flex;
      width: 100%;
      /* 🟢 The Magic Animation: Apple-style smooth glide */
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .trainer-card {
      min-width: 100%;
      box-sizing: border-box;
      padding: 0 16px; /* Gives it breathing room on mobile */
      margin: 0;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Only the active card is fully visible and full size */
    .trainer-card.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Adjust the submit button position for the new layout */
    .submit-area {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(5, 8, 5, 0.95); 
      backdrop-filter: blur(16px); 
      padding: 15px; 
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8); 
      margin: 0; 
      z-index: 1000;
      opacity: 0;
      pointer-events: none; 
      transform: translateY(100%);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .submit-area.show-submit {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Mobile adjustments */
    @media (min-width: 769px) {
      .submit-area {
        max-width: 650px;
        left: 50%;
        transform: translateX(-50%) translateY(100%);
        border-radius: 20px 20px 0 0;
      }
      .submit-area.show-submit {
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="bg-container" id="bg-zoom"></div>
  
  <header class="app-header" id="main-header">
    <div class="header-text">
      <h1>Trainer Excellence Feedback</h1>
      <p>Tap a rating. The next trainer will glide in automatically.</p>
    </div>
    <img src="logo.png" alt="High Impact Gym" class="header-logo">
  </header>

  <main class="survey-container">
    <form id="survey-form">
      
      <!-- The slider wrapper -->
      <div id="trainer-cards"></div>
      
      <!-- The button is hidden until the last trainer is rated -->
      <div class="submit-area" id="submit-area">
        <button type="submit" id="submit-btn">Complete Evaluation</button>
      </div>
    </form>
  </main>

  <!-- The Creative Success Popup -->
   <div id="success-popup" class="success-popup">
    <div class="success-icon-ring">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 36px; height: 36px;">
          <path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6"/>
          <rect x="6.5" y="8.5" width="11" height="7" rx="1.5"/>
        </svg>
      </div>
    </div>
    <h2>Feedback Sent!</h2>
    <p>Your evaluation has been securely recorded.<br>Thank you for shaping the High Impact experience!</p>
  </div>

  <script>
    // 1. HEADER HIDE ON SCROLL & BACKGROUND ZOOM
    let lastScrollTop = 0;
    const header = document.getElementById('main-header');
    const bgZoom = document.getElementById('bg-zoom');

    window.addEventListener('scroll', function() {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollTop > lastScrollTop && scrollTop > 50) {
        header.classList.add('header-hidden');
      } else {
        header.classList.remove('header-hidden');
      }
      lastScrollTop = scrollTop;

      if (bgZoom) {
        let maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          let scrollPercent = scrollTop / maxScroll; 
          let scale = 1 + (scrollPercent * 1.5); 
          bgZoom.style.transform = `scale(${scale})`;
        }
      }
    });

    // 2. BUILD THE TRAINER CARDS
    const trainers = [
      { id: "1", name: "Sameera", img: "assets/trainers/Sameera.png" },
      { id: "2", name: "Chamindu", img: "assets/trainers/Chamindu.png" },
      { id: "3", name: "Kavindu", img: "assets/trainers/Kavindu.png" },
      { id: "4", name: "Ravija", img: "assets/trainers/Navija.png" },
      { id: "5", name: "Bhagya", img: "assets/trainers/bhagya.png" },
      { id: "6", name: "Dilshan", img: "assets/trainers/Dilshan.png" },
      { id: "7", name: "Pavani", img: "assets/trainers/pavani.png" },
      { id: "8", name: "Thilini", img: "assets/trainers/Thilini.png" },
      { id: "9", name: "Hiruka", img: "assets/trainers/Hiruka.png" },
      { id: "10", name: "Shalani", img: "assets/trainers/Shalani.png" }
    ];

    const ratings = ["Excellent", "Good", "Average", "Needs Improvement", "Poor"];
    const container = document.getElementById('trainer-cards');
    
    trainers.forEach((t, index) => {
      const card = document.createElement('div');
      // Add 'active' class to the very first card
      card.className = index === 0 ? 'trainer-card active' : 'trainer-card';
      
      let buttonsHTML = '';
      ratings.forEach((r, i) => {
        const colorClass = ['btn-excellent', 'btn-good', 'btn-average', 'btn-needs', 'btn-poor'][i];
        buttonsHTML += `
          <label class="rating-btn ${colorClass}">
            <input type="radio" name="trainer_${t.id}" value="${r}" required>
            <span>${r}</span>
          </label>
        `;
      });

           card.innerHTML = `
        <div class="trainer-header" style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
          <img src="${t.img}" alt="${t.name}" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #4caf50; background: #222;" onerror="this.src='https://ui-avatars.com/api/?name=${t.name}&background=4caf50&color=fff&size=90'">
          <h2 style="margin: 0; font-size: 1.4rem; color: #fff; line-height: 1.2;">
            ${t.name} 
            <br>
            <span style="font-size:0.9rem; color:#8bb393; font-weight:normal;">(${index + 1} of 10)</span>
          </h2>
        </div>
        <div class="rating-options">
          ${buttonsHTML}
        </div>
      `;
      
      container.appendChild(card);
    });

    // 3. AUTO-ADVANCE LOGIC WITH SMOOTH FADE
    let currentIndex = 0;
    const totalTrainers = trainers.length;
    const submitArea = document.getElementById('submit-area');
    const cards = document.querySelectorAll('.trainer-card');

    container.addEventListener('change', (e) => {
      if (e.target.type === 'radio') {
        
        // Wait 450ms so the user sees the button turn green
        setTimeout(() => {
          if (currentIndex < totalTrainers - 1) {
            
            // Remove active class from current card
            cards[currentIndex].classList.remove('active');
            
            currentIndex++;
            
            // Add active class to next card
            cards[currentIndex].classList.add('active');
            
            // Slide the container
            container.style.transform = `translateX(-${currentIndex * 100}%)`;
          } else {
            // Last trainer rated! Show the button.
            submitArea.classList.add('show-submit');
          }
        }, 450); 
      }
    });

    // 4. SUBMIT FORM
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwbKqZy4tFHBlVZpSUHDtsejeTTPPLGgrzsuuNL5cbNKB3xBxHK9BM5MHfzMYcaloM/exec'; 

    document.getElementById('survey-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const popup = document.getElementById('success-popup');
      
      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);
      const payload = { timestamp: new Date().toISOString(), ratings: {} };
      
      trainers.forEach(t => {
        payload.ratings[t.name] = formData.get(`trainer_${t.id}`);
      });

      popup.classList.add('show');
      e.target.reset(); 
      submitArea.classList.remove('show-submit'); 
      
      // 🟢 RESET THE SLIDER FOR THE NEXT CUSTOMER
      currentIndex = 0;
      cards.forEach((card, i) => {
        if (i === 0) card.classList.add('active');
        else card.classList.remove('active');
      });
      container.style.transform = `translateX(0%)`;

      setTimeout(() => {
        popup.classList.remove('show');
        btn.textContent = 'Complete Evaluation';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 5000); 

      try {
        fetch(ENDPOINT, { 
          method: 'POST', 
          mode: 'no-cors', 
          body: JSON.stringify(payload) 
        });
      } catch (error) {
        console.log("Background submission error:", error);
      }
    });
  </script>
</body>
</html>
