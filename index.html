<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer Excellence Feedback</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
   <div class="bg-container" id="bg-zoom">
    <div class="bg-icon icon-1">🏋️‍♂️</div>
    <div class="bg-icon icon-2">🏋️‍♀️</div>
    <div class="bg-icon icon-3">⚡</div>
    <div class="bg-icon icon-4">💪</div>
  </div>
  
  <header class="app-header" id="main-header">
      <div class="header-text">
      <h1>Trainer Excellence Feedback</h1>
      <p>Help us recognize excellence by rating your instructor's performance and professionalism.</p>
    </div>
    <img src="logo.png" alt="High Impact Gym" class="header-logo">
  </header>

  <main class="survey-container">
    <form id="survey-form">
      <div id="trainer-cards"></div>
      <div class="submit-area">
        <button type="submit" id="submit-btn">Submit All Feedback</button>
      </div>
    </form>
  </main>

  <!-- 🎉 The Creative Success Popup (Corrected Location) -->
  <div id="success-popup" class="success-popup">
    <div class="success-icon-ring">
      <div class="success-icon">✓</div>
    </div>
    <h2>Feedback Sent!</h2>
    <p>Your evaluation has been securely recorded.<br>Thank you for shaping the High Impact experience!</p>
  </div>

  <script>
    // 1. COMBINED SCROLL EFFECTS (Header Hide + Continuous Background Zoom)
    let lastScrollTop = 0;
    const header = document.getElementById('main-header');
    const bgZoom = document.getElementById('bg-zoom');

    window.addEventListener('scroll', function() {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      
      // A. Hide/Show Header
      if (scrollTop > lastScrollTop && scrollTop > 100) {
        header.classList.add('header-hidden');
      } else {
        header.classList.remove('header-hidden');
      }
      lastScrollTop = scrollTop;

      // B. Continuous Background Zoom Effect
      if (bgZoom) {
        let maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          let scrollPercent = scrollTop / maxScroll; 
          let scale = 1 + (scrollPercent * 1.5); 
          bgZoom.style.transform = `scale(${scale})`;
        }
      }
    });

    // 2. BUILD THE TRAINER CARDS
    const trainers = [
      { id: "1", name: "Sameera", img: "assets/trainers/Sameera.png" },
      { id: "2", name: "Chamindu", img: "assets/trainers/Chamindu.png" },
      { id: "3", name: "Kavindu", img: "assets/trainers/Kavindu.png" },
      { id: "4", name: "Ravija", img: "assets/trainers/Navija.png" },
      { id: "5", name: "Bhagya", img: "assets/trainers/bhagya.png" },
      { id: "6", name: "Dilshan", img: "assets/trainers/Dilshan.png" },
      { id: "7", name: "Pavani", img: "assets/trainers/pavani.png" },
      { id: "8", name: "Thilini", img: "assets/trainers/Thilini.png" },
      { id: "9", name: "Hiruka", img: "assets/trainers/Hiruka.png" },
      { id: "10", name: "Shalani", img: "assets/trainers/Shalani.png" }
    ];

    const ratings = ["Excellent", "Good", "Average", "Needs Improvement", "Poor"];
    const container = document.getElementById('trainer-cards');
    
    trainers.forEach((t, index) => {
      const card = document.createElement('div');
      card.className = 'trainer-card';
      
      let buttonsHTML = '';
      ratings.forEach((r, i) => {
        const colorClass = ['btn-excellent', 'btn-good', 'btn-average', 'btn-needs', 'btn-poor'][i];
        buttonsHTML += `
          <label class="rating-btn ${colorClass}">
            <input type="radio" name="trainer_${t.id}" value="${r}" required>
            <span>${r}</span>
          </label>
        `;
      });

      // This now correctly generates the trainer card layout
      card.innerHTML = `
        <div class="trainer-header">
          <img src="${t.img}" alt="${t.name}" onerror="this.src='https://via.placeholder.com/80?text=No+Photo'">
          <h2>${t.name}</h2>
        </div>
        <div class="rating-options">
          ${buttonsHTML}
        </div>
      `;
      
      container.appendChild(card);
    });

    // 3. SUBMIT FORM (INSTANT UI + BACKGROUND SEND)
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwbKqZy4tFHBlVZpSUHDtsejeTTPPLGgrzsuuNL5cbNKB3xBxHK9BM5MHfzMYcaloM/exec'; 

    document.getElementById('survey-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const popup = document.getElementById('success-popup');
      
      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);
      const payload = { timestamp: new Date().toISOString(), ratings: {} };
      
      trainers.forEach(t => {
        payload.ratings[t.name] = formData.get(`trainer_${t.id}`);
      });

      // 🟢 INSTANT SUCCESS: Show the popup immediately
      popup.classList.add('show');
      
      // Reset the form instantly in the background
      e.target.reset(); 
      
      // Wait 3 seconds while the popup is showing, then hide it and restore the button
      setTimeout(() => {
        popup.classList.remove('show');
        btn.textContent = 'Submit All Feedback';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 3000);

      // 🟢 SEND DATA IN BACKGROUND (User doesn't wait for this)
      try {
        fetch(ENDPOINT, { 
          method: 'POST', 
          mode: 'no-cors', 
          body: JSON.stringify(payload) 
        });
      } catch (error) {
        console.log("Background submission error:", error);
      }
    });
  </script>
</body>
</html>
